[project]
name = "trip-planner"
version = "0.1.0"
description = "AI-powered trip planning assistant"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "python-dotenv>=1.0.0",
    "pydantic>=2.12",
    "pydantic-settings>=2.6.0",
    "httpx>=0.27.0", # For ollama API calls
    "pyjwt>=2.10.1",
    "pwdlib[argon2]>=0.3.0",
    "python-multipart>=0.0.21",
    "pydantic-ai>=0.8.1",
    # Phase 6 — D-01 (psycopg async + SQLAlchemy 2.0 + SQLModel) and D-11 (alembic from day 1).
    # Versions verified in 06-RESEARCH.md §Standard Stack + §Package Legitimacy Audit.
    "psycopg[binary,pool]>=3.3.4",
    "sqlmodel>=0.0.38",
    "alembic>=1.18.4",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0",
    "httpx>=0.27.0", # For testing FastAPI
    "ruff>=0.7.0",
    "mypy>=1.13.0",
    "erk>=0.9.0",
    # Phase 6 — pytest-postgresql `postgresql_noproc` fixture pointed at the compose `db`.
    "pytest-postgresql>=8.1.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
pythonpath = ["."]

[tool.mypy]
python_version = "3.13"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

[tool.ruff]
line-length = 120
target-version = "py313"
exclude = [
    ".git",
    ".venv",
    "venv",
    "__pycache__",
    ".pytest_cache",
    ".mypy_cache",
    ".ruff_cache",
]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # Pyflakes
    "I",    # isort
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "N",    # pep8-naming
    "SIM",  # flake8-simplify
    "TCH",  # flake8-type-checking
]
ignore = [
    "E501",  # Line too long (handled by formatter)
]
fixable = ["ALL"]
unfixable = []

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]  # Allow assert in tests
# Wave 0 RED stubs use ``pytest.importorskip(...)`` BEFORE app imports so test
# collection succeeds in environments where pydantic-ai or ChatDeps don't
# exist yet (the modules they depend on land in Wave 1+). The intentional
# import ordering produces E402; the alternative (stuffing the importorskip
# inside a function) defeats collection-time skipping.
"tests/integration/llm/test_*_thinking_live.py" = ["S101", "E402"]
"tests/unit/llm/test_protocol_abc.py" = ["S101", "E402"]
"tests/unit/llm/test_build_agent.py" = ["S101", "E402"]
"tests/unit/llm/providers/test_ollama_thinking.py" = ["S101", "E402"]
"tests/unit/llm/providers/test_openai_dispatch.py" = ["S101", "E402"]
